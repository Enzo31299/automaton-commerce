name: CI
on: [push, pull_request]
jobs:
  trader-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Run Trader tests
        run: pnpm exec vitest run src/__tests__/trading.test.ts src/__tests__/trading-backtest.test.ts src/__tests__/trading-walk-forward.test.ts src/__tests__/trading-market-data.test.ts src/__tests__/trading-historical-data.test.ts src/__tests__/trading-coinbase-market-data.test.ts

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Run tests
        timeout-minutes: 10
        run: timeout 300 pnpm test --pool=forks
      - name: Run security tests
        timeout-minutes: 10
        run: timeout 180 pnpm exec vitest run --pool=forks -t "security|injection|policy|financial"

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || true
